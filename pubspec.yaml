name: restaurant_app
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  equatable: ^2.1.0
  dartz: ^0.10.1
  shimmer: ^3.0.0
  dio: ^5.11.0
  webview_flutter: ^4.14.1
  image_picker: ^1.2.3
  firebase_storage: ^13.4.6
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 👈 المكتبات الجديدة اللي ضفناها
  flutter_launcher_icons: any
  flutter_native_splash: any
  change_app_package_name: ^1.5.0

# 👈 إعدادات أيقونة التطبيق
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

# 👈 إعدادات شاشة البداية
flutter_native_splash:
  color: "#ffffff" 
  image: "assets/images/splash.png"
  android: true
  ios: true
  android_12:
    image: "assets/images/splash.png"
    color: "#ffffff"

flutter:
  uses-material-design: true
  
  # 👈 تفعيل مجلد الصور
  assets:
    - assets/images/